name: Release APK

# Тег создаётся вручную; сборка прикладывает APK к релизу с этим тегом.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Установить зависимости
        run: npm ci

      - name: Проверить типы и прогнать тесты
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Сгенерировать нативный проект
        run: npx expo prebuild --platform android --no-install

      # Свой ключ необязателен: prebuild кладёт в проект debug.keystore из шаблона,
      # и release-сборка по умолчанию подписывается им. Ключ этот фиксированный —
      # один и тот же при каждой генерации, поэтому обновления ставятся поверх.
      # Но он публичный и общий для всех проектов на React Native, так что любой
      # может собрать APK с той же подписью. Как только секрет ANDROID_KEYSTORE_BASE64
      # появится, сборка молча переключится на него.
      - name: Развернуть keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан — APK будет подписан общим debug-ключом React Native."
            echo "custom=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "custom=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Собрать релизный APK
        env:
          CUSTOM_KEYSTORE: ${{ steps.keystore.outputs.custom }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ "$CUSTOM_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/release.keystore" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          else
            ./gradlew assembleRelease
          fi

      - name: Переименовать APK по тегу
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/car-reminder-${GITHUB_REF_NAME}.apk"

      - name: Приложить APK к релизу
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          fail_on_unmatched_files: true
